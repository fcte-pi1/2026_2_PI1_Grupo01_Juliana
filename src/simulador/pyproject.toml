[project]
name = "micromouse-simulador"
version = "0.1.0"
description = "Simulador do Micromouse que emite a telemetria do contrato v1"
requires-python = ">=3.12"
dependencies = [
    "micromouse-backend",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv.sources]
micromouse-backend = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulador"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
