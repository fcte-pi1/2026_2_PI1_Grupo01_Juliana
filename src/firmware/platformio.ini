; Firmware do Micromouse Ratatouille (ESP32 DevKit V1)
;
; Ambientes:
;   esp32_sim -> compila para a ESP32 usando a HAL simulada
;   esp32_sim_depuracao -> esp32_sim com linhas # na serial (FIRM-07 / #123)
;   native    -> compila no PC, usado pelos testes Unity (pio test -e native)
;   native_cov -> testes com cobertura (gcovr; ver README)
;   ele06_bancada -> teste de bancada da Eletrônica (ELE-06): watchdog e I²C
;   ele09_teste1..3 -> testes de bancada da Eletrônica (ELE-09):
;                      sensores ToF e telemetria Bluetooth
;   ele09_bateria_serial -> teste auxiliar da bateria via serial
;   ele09_bateria_bt -> teste auxiliar da bateria via Bluetooth
;   ele09_pisca -> teste auxiliar de LED
;   ele09_ponte_h, ele09_ponte_h_rapido -> ponte H TB6612 com os motores
;   ele09_encoder, ele09_dois_motores -> motores com leitura dos encoders
;   esp32_drivers -> compila os drivers reais de lib/hal/esp32 em bancada
;   esp32_hc_bancada -> bancada do health-check: DIP, motores, encoders e bateria reais
;   esp32_real_hc -> firmware com a HAL real, só o health-check (ToF real)
;   esp32_real_hc_tof_mock -> o mesmo, com o ToF mockado (o health-check aprova)
;   esp32_real -> firmware completo no robô (HAL real, navegação e movimento); esp32_real_tof_mock com o ToF mockado
;
; Os programas de bancada não representam o firmware completo do robô.
; O ambiente com os drivers reais será integrado ao firmware no FIRM-10.

[platformio]
default_envs = esp32_sim

[env]
; -I include disponibiliza config/pinos.h e config/robo.h também em lib/
build_flags =
    -Wall
    -Wextra
    -I include

; ============================================================
; Firmware principal com HAL simulada
; ============================================================

[env:esp32_sim]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -D HAL_SIMULADA
test_framework = unity
test_filter = test_desempenho_nav

; Igual ao esp32_sim, com nav_periodo_max_ms e ToF na serial a cada 5 s.
; Upload: pio run -e esp32_sim_depuracao -t upload

[env:esp32_sim_depuracao]
extends = env:esp32_sim
build_flags =
    ${env:esp32_sim.build_flags}
    -D TELEMETRIA_DEPURACAO

; Igual ao esp32_sim, mas o BOOT é o botão físico da placa: valida o toque na corrida simulada,
; em que o robô anda de verdade pelo mundo simulado e leva alguns segundos por célula.
; Upload: pio run -e esp32_sim_boot -t upload

[env:esp32_sim_boot]
extends = env:esp32_sim
build_flags =
    ${env:esp32_sim.build_flags}
    -D BOOT_FISICO

; ============================================================
; Testes nativos no computador
; ============================================================

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -D HAL_SIMULADA
    -lm

; Cobertura dos testes: -O0 para facilitar a correspondência com o fonte
[env:native_cov]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O0
    --coverage
    -lgcov

; ============================================================
; ELE-06 - Watchdog e I²C
; ============================================================

; Programa independente em bancada/ele06/.
; Não compila src/ nem a HAL do firmware principal.
; Não faz parte do CI nem da compilação padrão.
; Upload: pio run -e ele06_bancada -t upload

[env:ele06_bancada]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/ele06/>
build_flags =
    ${env.build_flags}

