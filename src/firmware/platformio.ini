; Firmware do Micromouse Ratatouille (ESP32 DevKit V1)
;
; Ambientes:
;   esp32_sim -> compila para a ESP32 usando a HAL simulada (roda sem nenhum sensor ligado)
;   native    -> compila no PC, usado pelos testes Unity (pio test -e native)
;
; O ambiente com os drivers reais (sem HAL_SIMULADA) entra junto com o FIRM-10.

[platformio]
default_envs = esp32_sim

[env]
; -I include deixa config/pinos.h e config/robo.h visíveis também em lib/
build_flags =
    -Wall
    -Wextra
    -I include

[env:esp32_sim]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -D HAL_SIMULADA

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -D HAL_SIMULADA
    -lm
