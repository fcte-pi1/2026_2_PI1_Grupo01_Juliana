; Firmware do Micromouse Ratatouille (ESP32 DevKit V1)
;
; Ambientes:
;   esp32_sim -> compila para a ESP32 usando a HAL simulada (roda sem nenhum sensor ligado)
;   native    -> compila no PC, usado pelos testes Unity (pio test -e native)
;   ele06_bancada -> teste de bancada da Eletrônica (ELE-06): watchdog e I²C;
;                    não é o firmware do robô (pio run -e ele06_bancada -t upload)
;   ele09_teste1..3 -> testes de bancada da Eletrônica (ELE-09): sensores ToF
;                    e telemetria Bluetooth, em bancada/ele09/
;
; O ambiente com os drivers reais (sem HAL_SIMULADA) entra junto com o FIRM-10.

[platformio]
default_envs = esp32_sim

[env]
; -I include deixa config/pinos.h e config/robo.h visíveis também em lib/
build_flags =
    -Wall
    -Wextra
    -I include

[env:esp32_sim]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -D HAL_SIMULADA
; Na placa só roda o teste de desempenho (os outros leem arquivos do PC)
test_framework = unity
test_filter = test_desempenho_nav

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -D HAL_SIMULADA
    -lm

; ELE-06 (Eletrônica): configuração do microcontrolador, watchdog e teste do I²C.
; Programa à parte em bancada/ele06/: não compila src/ nem a HAL, só usa
; config/pinos.h e config/robo.h. Não entra no CI nem no `pio run` padrão.
[env:ele06_bancada]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bancada/ele06/>
build_flags =
    ${env.build_flags}

; ELE-09 (Eletrônica): roteiro de testes da Dupla 3 com o VL53L0X na bancada.
; Programas à parte em bancada/ele09/, um ambiente por teste:
;   pio run -e ele09_teste1 -t upload   (I2C scanner)
;   pio run -e ele09_teste2 -t upload   (média móvel + LED no limiar de 100 mm)
;   pio run -e ele09_teste3 -t upload   (telemetria Bluetooth "Ratatuli_ToF" a 10 Hz)
[env:ele09_teste1]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bancada/ele09/teste1_i2c_scanner/*.cpp>
build_flags =
    ${env.build_flags}

[env:ele09_teste2]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bancada/ele09/teste2_filtro_limiar/*.cpp>
build_flags =
    ${env.build_flags}
lib_deps = adafruit/Adafruit_VL53L0X @ ^1.2.4

[env:ele09_teste3]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bancada/ele09/teste3_bluetooth/*.cpp>
build_flags =
    ${env.build_flags}
lib_deps = adafruit/Adafruit_VL53L0X @ ^1.2.4

; ---- Testes auxiliares da equipe (bateria e alimentação), fora do roteiro da ELE-09 ----

[env:ele09_bateria_serial]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bancada/ele09/bateria_serial/*.cpp>

[env:ele09_bateria_bt]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bancada/ele09/bateria_bluetooth/*.cpp>

[env:ele09_pisca]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
build_src_filter = -<*> +<../bancada/ele09/pisca/*.cpp>
