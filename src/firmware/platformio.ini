; ============================================================
; Drivers reais da ESP32
; ============================================================

; Compila os drivers reais usados em bancada, sem a HAL simulada.
; Enquanto o FIRM-10 não integrar os drivers ao firmware completo,
; este ambiente permite verificar se eles compilam.
;
; Upload: pio run -e esp32_drivers -t upload

[env:esp32_drivers]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/drivers/>
build_flags =
    ${env.build_flags}
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4

[env:esp32_hc_bancada]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/health_check/>
build_flags =
    ${env.build_flags}
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4


[env:esp32_real_hc]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../real/>
build_flags =
    ${env.build_flags}
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4

; ToF mockado: leituras fixas, o health-check aprova mesmo com os laterais em falta.
[env:esp32_real_hc_tof_mock]
extends = env:esp32_real_hc
build_flags =
    ${env:esp32_real_hc.build_flags}
    -D TOF_MOCK

; Firmware completo no robô: HAL real, navegação, movimento, health-check, BOOT e telemetria pela serial USB.
; Os motores só andam com o interruptor da bateria ligado: robô no chão, em pista.
; Upload: pio run -e esp32_real -t upload
[env:esp32_real]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4

; O mesmo, com o ToF mockado (frontal 300 mm, laterais 120 mm): para andar com os laterais em falta.
[env:esp32_real_tof_mock]
extends = env:esp32_real
build_flags =
    ${env:esp32_real.build_flags}
    -D TOF_MOCK

; Bancada de calibração no robô montado: pulsos por célula e por giro, velocidade, stuck e limiares dos ToF.
; Upload: pio run -e esp32_calibracao -t upload
[env:esp32_calibracao]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/calibracao/>
build_flags =
    ${env.build_flags}
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4

; Firmware completo no robô com o Bluetooth real (SPP "Ratatouille"): o notebook pareia e abre /dev/rfcomm0, e a
; ponte do backend lê o contrato por lá. Sem cabo USB. O app do Bluetooth clássico é grande: partição huge_app.
; Upload: pio run -e esp32_real_bt -t upload
[env:esp32_real_bt]
extends = env:esp32_real
board_build.partitions = huge_app.csv
build_flags =
    ${env:esp32_real.build_flags}
    -D BT_REAL

; Firmware completo com o enlace pelo Wi-Fi da casa, no lugar do Bluetooth (só para testes, sem Bluetooth no notebook):
; o robô entra na rede de include/config/wifi_local.h (copie o wifi_local.exemplo.h) e abre a porta TCP 3333. A ponte
; do backend conecta com --porta socket://ratatouille.local:3333 (ou o IP que o robô imprime no USB).
; Upload: pio run -e esp32_real_wifi -t upload
[env:esp32_real_wifi]
extends = env:esp32_real
board_build.partitions = huge_app.csv
build_flags =
    ${env:esp32_real.build_flags}
    -D WIFI_REAL

; O mesmo, com o ToF mockado.
[env:esp32_real_bt_tof_mock]
extends = env:esp32_real_bt
build_flags =
    ${env:esp32_real_bt.build_flags}
    -D TOF_MOCK

; Bancada de calibração com o Bluetooth: as mesmas teclas pelo USB e pelo /dev/rfcomm0, para calibrar na pista sem cabo.
; Upload: pio run -e esp32_calibracao_bt -t upload
[env:esp32_calibracao_bt]
extends = env:esp32_calibracao
board_build.partitions = huge_app.csv
build_flags =
    ${env:esp32_calibracao.build_flags}
    -D BT_REAL

; Regulagem de pista de 27/11/2026 (docs: ver README da movimentação). Os valores entram só aqui, por opção de
; compilação: os padrões de include/config/robo.h continuam os do simulador. BITOLA_MM vem da calibração de giro
; (10 giros de 90° com a tecla Q da bancada); repita no piso da prova. PAREDE_ESPESSURA_MM é a do labirinto.
[pista]
build_flags =
    -D GIRO_RECUO_EXTRA_MM=12.0f
    -D GIRO_NO_CENTRO_SE_ABERTO=1
    -D VELOCIDADE_CRUZEIRO_MM_S=120.0f
    -D MOV_VELOCIDADE_GIRO_LUGAR_MM_S=110.0f
    -D GIRO_FRENTE_ANTES_DO_ARCO_MM=132
    -D PAREDE_LADO_ENTRA_MM=100
    -D PAREDE_LADO_SAI_MM=115
    -D GIRO_CENTRO_ATRAS_MM=14.0f
    -D MOV_RUMO_FUSAO=0.09f
    -D BITOLA_MM=90.5f
    -D MOV_DERIVA_APRENDIZADO=0.15f

; Corrida com a regulagem de pista, labirinto de casa com parede de 1,8 cm (o que rodou em 27/11/2026).
; Upload (Windows com acento no usuário): tools\pio.cmd run -e esp32_pista_bt -t upload --upload-port COM6
; Labirinto oficial (parede de 1,2 cm): troque o 18 da última linha por 12 antes de gravar (ainda não rodou em pista).
[env:esp32_pista_bt]
extends = env:esp32_real_bt
build_flags =
    ${env:esp32_real_bt.build_flags}
    ${pista.build_flags}
    -D PAREDE_ESPESSURA_MM=18

; Bancada (teclas a, A, g, G, h, Q, t...) com a mesma regulagem de pista: para calibrar o giro e a reta.
[env:esp32_calibracao_pista_bt]
extends = env:esp32_calibracao_bt
build_flags =
    ${env:esp32_calibracao_bt.build_flags}
    ${pista.build_flags}
    -D PAREDE_ESPESSURA_MM=18
