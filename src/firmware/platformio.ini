; Firmware do Micromouse Ratatouille (ESP32 DevKit V1)
;
; Ambientes:
;   esp32_sim -> compila para a ESP32 usando a HAL simulada
;   native    -> compila no PC, usado pelos testes Unity (pio test -e native)
;   native_cov -> testes com cobertura (gcovr; ver README)
;   ele06_bancada -> teste de bancada da Eletrônica (ELE-06): watchdog e I²C
;   ele09_teste1..3 -> testes de bancada da Eletrônica (ELE-09):
;                      sensores ToF e telemetria Bluetooth
;   ele09_bateria_serial -> teste auxiliar da bateria via serial
;   ele09_bateria_bt -> teste auxiliar da bateria via Bluetooth
;   ele09_pisca -> teste auxiliar de LED
;   esp32_drivers -> compila os drivers reais de lib/hal/esp32 em bancada
;
; Os programas de bancada não representam o firmware completo do robô.
; O ambiente com os drivers reais será integrado ao firmware no FIRM-10.

[platformio]
default_envs = esp32_sim

[env]
; -I include disponibiliza config/pinos.h e config/robo.h também em lib/
build_flags =
    -Wall
    -Wextra
    -I include

; ============================================================
; Firmware principal com HAL simulada
; ============================================================

[env:esp32_sim]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -D HAL_SIMULADA
test_framework = unity
test_filter = test_desempenho_nav

; ============================================================
; Testes nativos no computador
; ============================================================

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -D HAL_SIMULADA
    -lm

; Cobertura dos testes: -O0 para facilitar a correspondência com o fonte
[env:native_cov]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O0
    --coverage
    -lgcov

; ============================================================
; ELE-06 - Watchdog e I²C
; ============================================================

; Programa independente em bancada/ele06/.
; Não compila src/ nem a HAL do firmware principal.
; Não faz parte do CI nem da compilação padrão.
; Upload: pio run -e ele06_bancada -t upload

[env:ele06_bancada]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/ele06/>
build_flags =
    ${env.build_flags}

; ============================================================
; ELE-09 - Testes de sensores ToF
; ============================================================

; Teste 1: scanner I²C
; Upload: pio run -e ele09_teste1 -t upload

[env:ele09_teste1]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/ele09/teste1_i2c_scanner/*.cpp>
build_flags =
    ${env.build_flags}

; Teste 2: filtro de média móvel e LED no limiar de 100 mm

[env:ele09_teste2]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/ele09/teste2_filtro_limiar/*.cpp>
build_flags =
    ${env.build_flags}
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4

; Teste 3: telemetria Bluetooth "Ratatuli_ToF" a 10 Hz

[env:ele09_teste3]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/ele09/teste3_bluetooth/*.cpp>
build_flags =
    ${env.build_flags}
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4

; ============================================================
; ELE-09 - Testes auxiliares de bateria e alimentação
; ============================================================

; Teste da bateria via serial

[env:ele09_bateria_serial]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/ele09/bateria_serial/*.cpp>
build_flags =
    ${env.build_flags}

; Teste da bateria via Bluetooth

[env:ele09_bateria_bt]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/ele09/bateria_bluetooth/*.cpp>
build_flags =
    ${env.build_flags}

; Teste de LED

[env:ele09_pisca]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/ele09/pisca/*.cpp>
build_flags =
    ${env.build_flags}

; ============================================================
; Drivers reais da ESP32
; ============================================================

; Compila os drivers reais usados em bancada, sem a HAL simulada.
; Enquanto o FIRM-10 não integrar os drivers ao firmware completo,
; este ambiente permite verificar se eles compilam.
;
; Upload: pio run -e esp32_drivers -t upload

[env:esp32_drivers]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../bancada/drivers/>
build_flags =
    ${env.build_flags}