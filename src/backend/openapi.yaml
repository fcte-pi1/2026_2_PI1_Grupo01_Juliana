            falha: null
        trajeto:
          - passo_id: 40
            seq: 1
            x: 0
            y: 0
            paredes_mask: 12
            retomada: false
            entrou_em: "2026-10-07T14:00:30-03:00"
          - passo_id: 41
            seq: 2
            x: 0
            y: 1
            paredes_mask: 9
            retomada: false
            entrou_em: "2026-10-07T14:03:22-03:00"
        leituras:
          - ordem: 42
            x: 0
            y: 2
            bateria: 7.81
            velocidade: 0.21
            rumo: "N"
            enviado_em: "2026-10-07T14:03:21-03:00"
    Tela06SemComunicacao:
      summary: >
        Tela 06. A tentativa segue running e a View compara ultima_mensagem_em
