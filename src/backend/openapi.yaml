openapi: 3.0.3
info:
  title: Micromouse - Telemetria - API
  version: 1.0.0
  description: >
    Contrato HTTP entre a View, a conexão Bluetooth e o backend.

tags:
  - name: execucoes
  - name: stream
  - name: telemetria

paths:
  /execucoes:
    get:
      operationId: listarExecucoes
      tags: [execucoes]
      summary: Listar execuções, todas ou de um labirinto
      description: >
        Sem o parâmetro, devolve os três labirintos na mesma lista (US27).
        Com labirinto, filtra um tipo (US26). A tela inicial usa o primeiro
        item como última execução quando não há execução em andamento.
      parameters:
        - name: labirinto
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Labirinto"
          example: "4x4"
      responses:
        "200":
          description: Lista de execuções, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResumoExecucao"
              examples:
                todos:
                  summary: Todos as execuções de todos os labirintos
                  value:
                    - execucao_id: 123e4567-e89b-12d3-a456-426614174000
                      labirinto: "4x4"
                      status: concluida
                      tentativas_usadas: 1
                      iniciada_em: "2026-10-07T14:00:00-03:00"
                      encerrada_em: "2026-10-07T14:00:33-03:00"
                      tempo_total_s: 33.1
                      velocidade_media: 0.078
                      consumo_bateria: 2.8
                    - execucao_id: 123e4567-e89b-12d3-a456-426614174099
                      labirinto: "8x4"
                      status: cancelada
                      tentativas_usadas: 3
                      iniciada_em: "2026-10-06T15:00:00-03:00"
                      encerrada_em: "2026-10-06T15:01:36-03:00"
                      tempo_total_s: 96.5
                      velocidade_media: 0.07
                      consumo_bateria: 4.2
                    - execucao_id: 123e4567-e89b-12d3-a456-426614174091
                      labirinto: "12x4"
                      status: em_andamento
                      tentativas_usadas: 0
                      iniciada_em: "2026-10-07T14:00:00-03:00"
                      encerrada_em: null
                      tempo_total_s: 0.0
                      velocidade_media: null
                      consumo_bateria: null
                filtrado:
                  summary: US26, só o labirinto pedido
                  value:
                    - execucao_id: 123e4567-e89b-12d3-a456-426614174000
                      labirinto: "4x4"
                      status: concluida
                      tentativas_usadas: 1
                      iniciada_em: "2026-10-07T14:00:00-03:00"
                      encerrada_em: "2026-10-07T14:00:33-03:00"
                      tempo_total_s: 33.1
                      velocidade_media: 0.078
                      consumo_bateria: 2.8
    post:
      operationId: novaExecucao
      tags: [execucoes]
      summary: Registra uma nova execução, contando 1/3 tentativas.
      description: >
        O operador informa o labirinto. O backend abre a execução lógica,
        começa o relógio de 10 minutos e cria a tentativa 1.
        Se já houver execução em andamento, ela é cancelada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovaExecucao"
            example:
              labirinto: "4x4"
      responses:
        "201":
          description: Execução criada com sucesso, contando 1/3 tentativas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetornoNovaExecucao"
              example:
                execucao_id: 123e4567-e89b-12d3-a456-426614174000
                tentativa_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                attempt_index: 1
        "422":
          $ref: "#/components/responses/ErroValidacao"

  /execucoes/em-andamento:
    get:
      operationId: buscarExecucaoEmAndamento
      tags: [execucoes]
      summary: Retrato da execução lógica em andamento
      description: >
        No máximo uma execução fica em_andamento (US12).
        A tela carrega este retrato e depois assina o stream.
        Registrar esta rota antes de /execucoes/{execucao_id}.
      responses:
        "200":
          description: Há uma execução em andamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecucaoDetalhe"
              examples:
                tela-02-health-check:
                  $ref: "#/components/examples/Tela02HealthCheck"
                tela-03-em-execucao:
                  $ref: "#/components/examples/Tela03EmExecucao"
                tela-06-sem-comunicacao:
                  $ref: "#/components/examples/Tela06SemComunicacao"
        "204":
          description: >
            Tela 01, início sem execução ativa. A última execução concluída
            vem de GET /execucoes.

  /execucoes/{execucao_id}:
    get:
      operationId: buscarExecucao
      tags: [execucoes]
      summary: Consultar uma execução, com trajeto, tentativas e health-check
      description: >
        Devolve o que a US28 pede para reexibir o percurso, inclusive depois
        de encerrada. O acompanhamento ao vivo continua no stream.
      parameters:
        - $ref: "#/components/parameters/ExecucaoId"
      responses:
        "200":
          description: Execução encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecucaoDetalhe"
              examples:
                tela-04-concluida:
                  $ref: "#/components/examples/Tela04Concluida"
                tela-08-encerrada-como-falha:
                  $ref: "#/components/examples/Tela08EncerradaComoFalha"
                tela-10-retomada:
                  $ref: "#/components/examples/Tela10Retomada"
                tela-11-concluida-apos-retomada:
                  $ref: "#/components/examples/Tela11ConcluidaAposRetomada"
                tela-12-falha-sem-retomada:
                  $ref: "#/components/examples/Tela12FalhaSemRetomada"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /execucoes/{execucao_id}/encerrar-tentativa:
    post:
      operationId: encerrarTentativa
      tags: [execucoes]
      summary: Encerrar a tentativa aberta, mantendo a execução em andamento
      description: >
        Tela 07 é o modal deste pedido (US22, RF30). A tentativa passa a
        failed com origem encerrado_operador. A execução lógica permanece
        em_andamento, para a retomada. O backend passa a devolver o comando
        de interrupção em POST /telemetria.
      parameters:
        - $ref: "#/components/parameters/ExecucaoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncerrarTentativa"
            examples:
              tela-07-encerrar:
                summary: Tela 07, motivo obrigatório e observação opcional
                value:
                  motivo: collision
                  observacao: Bateu na parede norte da célula (1, 2).
      responses:
        "200":
          description: Tentativa encerrada. O corpo é o retrato da tela 08.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecucaoDetalhe"
              examples:
                tela-08-encerrada-como-falha:
                  $ref: "#/components/examples/Tela08EncerradaComoFalha"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "422":
          $ref: "#/components/responses/ErroValidacao"

  /execucoes/{execucao_id}/retomar:
    post:
      operationId: retomarTentativa
      tags: [execucoes]
      summary: Abrir a tentativa seguinte depois de uma falha
      description: >
        Tela 09 é o modal, sem corpo. Em caso de sucesso a resposta é o
        recibo da tentativa 2 ou 3 (tela 10 começa depois disso).
        Recusa com 409 e não cria tentativa (US20, US21, RF19).
      parameters:
        - $ref: "#/components/parameters/ExecucaoId"
      responses:
        "201":
          description: Nova tentativa aberta. attempt_index é 2 ou 3.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetornoNovaExecucao"
              examples:
                tela-10-retomada:
                  summary: Recibo da tentativa 2/3
                  value:
                    execucao_id: 123e4567-e89b-12d3-a456-426614174000
                    tentativa_id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                    attempt_index: 2
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Recusa"

  /execucoes/{execucao_id}/stream:
    get:
      operationId: abrirStream
      tags: [stream]
      summary: Eventos da execução ao vivo
      description: >
        SSE (US08). O campo event repete o tipo do JSON em data.
        No evento passo, a linha id é o passo_id. Ao reconectar, o navegador
        envia esse valor em Last-Event-ID e o backend reenvia os passos
        posteriores. A amostra telemetria não entra nesse replay.
      parameters:
        - $ref: "#/components/parameters/ExecucaoId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
          description: passo_id do último passo já aplicado na tela.
      responses:
        "200":
          description: Fluxo text/event-stream.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                telemetria:
                  summary: Amostra de célula, bateria e velocidade
                  value: |
                    event: telemetria
                    data: {"tipo":"telemetria","ordem":42,"x":0,"y":2,"bateria":7.81,"velocidade":0.21,"rumo":"N","eixo_longo":null,"enviado_em":"2026-10-07T14:03:21-03:00"}
                passo:
                  summary: id igual ao passo_id, para o Last-Event-ID
                  value: |
                    id: 41
                    event: passo
                    data: {"tipo":"passo","passo_id":41,"seq":2,"x":0,"y":1,"paredes_mask":9,"retomada":false,"entrou_em":"2026-10-07T14:03:22-03:00"}
                status:
                  summary: Health-check aprovado, tentativa passa a running
                  value: |
                    event: status
                    data: {"tipo":"status","tentativa_id":"7c9e6679-7425-40de-944b-e07fc1f90ae7","attempt_index":1,"status_tentativa":"running","status_execucao":"em_andamento","tipo_dip":"4x4"}
                health_check:
                  summary: Um componente verificado
                  value: |
                    event: health_check
                    data: {"tipo":"health_check","tentativa_id":"7c9e6679-7425-40de-944b-e07fc1f90ae7","componente":"bateria","aprovado":true,"valor_lido":7.84}
                falha:
                  summary: Tentativa encerrada com falha
                  value: |
                    event: falha
                    data: {"tipo":"falha","tentativa_id":"7c9e6679-7425-40de-944b-e07fc1f90ae7","motivo":"collision","origem":"encerrado_operador","celula_x":1,"celula_y":2,"componente":null,"observacao":"Bateu na parede norte da célula (1, 2).","momento_falha":"2026-10-07T14:04:00-03:00","status_execucao":"em_andamento"}
                sucesso:
                  summary: Objetivo alcançado
                  value: |
                    event: sucesso
                    data: {"tipo":"sucesso","tentativa_id":"7c9e6679-7425-40de-944b-e07fc1f90ae7","x":3,"y":3,"status_execucao":"concluida"}
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /telemetria:
    post:
      operationId: receberTelemetria
      tags: [telemetria]
      summary: Receber uma linha da ponte Bluetooth
      description: >
        A ponte não interpreta a linha. O backend valida o JSON interno
        conforme o contrato 4.4.1 e, se a linha for inválida, descarta e
        registra em log, ainda assim respondendo 200.
        A resposta traz os comandos para escrever na serial. A lista fica
        com interromper depois de Encerrar tentativa, até a confirmação do
        robô ou até abrir outra tentativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinhaTelemetria"
            example:
              linha: '{"v":1,"boot":7,"seq":42,"t_ms":11250,"tipo":"tel","estado":"running","x":0,"y":2,"rumo":"N","bat_mv":7810,"vel_mm_s":210,"eixo_longo":null}'
              recebido_em: "2026-10-07T14:03:21.512-03:00"
      responses:
        "200":
          description: Comandos pendentes para a serial. Lista vazia se não houver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaTelemetria"
              examples:
                sem-comando:
                  value:
                    comandos: []
                interromper:
                  summary: Downlink depois de Encerrar tentativa (RF39)
                  value:
                    comandos:
                      - v: 1
                        cmd: interromper
        "422":
          $ref: "#/components/responses/ErroValidacao"

components:
  parameters:
    ExecucaoId:
      name: execucao_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NaoEncontrado:
      description: Não há execução com esse execucao_id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroNaoEncontrado"
          example:
            detail: Execução não encontrada.
    Recusa:
      description: >
        Tela 05 e as outras recusas de retomada (RF19).
        Nenhuma tentativa nova é gravada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Recusa"
          examples:
            tela-05-tentativa-aberta:
              summary: Tela 05. Já existe tentativa em health-check ou running.
              value:
                motivo: tentativa_aberta
                ocorrida_em: "2026-10-07T14:04:02-03:00"
            limite-3:
              summary: As três tentativas já foram consumidas.
              value:
                motivo: limite_3
                ocorrida_em: "2026-10-07T14:12:00-03:00"
            execucao-cancelada:
              summary: A execução já está cancelada ou o tempo acabou.
              value:
                motivo: execucao_cancelada
                ocorrida_em: "2026-10-07T14:12:00-03:00"
    ErroValidacao:
      description: Corpo ou parâmetro fora do contrato.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroValidacao"

