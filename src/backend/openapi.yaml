  schemas:
    Labirinto:
      type: string
      enum: ["4x4", "8x4", "12x4"]
    StatusExecucao:
      type: string
      enum: [em_andamento, concluida, cancelada]
    StatusTentativa:
      type: string
      enum: [health-check, running, success, failed]
    TipoInicio:
      type: string
      enum: [nova, retomada]
    TipoDip:
      type: string
      description: Tipo lido no DIP. invalido é o código 11 e reprova o health-check.
      enum: ["4x4", "8x4", "12x4", invalido]
    Componente:
      type: string
      enum:
        - bateria
        - tof_frontal_esq
        - tof_frontal_dir
        - tof_esquerdo
        - tof_direito
        - motor_esquerdo
        - motor_direito
        - encoder_esquerdo
        - encoder_direito
    MotivoFalha:
      type: string
      enum:
        - collision
        - stuck
        - out_of_track
        - time_exceeded
        - falha_componente
        - low_battery
        - health_check_failed
        - link_lost
        - encerrado_operador
    MotivoEncerramento:
      type: string
      description: Motivos que o operador pode escolher no modal (RF30).
      enum: [collision, stuck, out_of_track]
    OrigemFalha:
      type: string
      description: Origem gravada em FALHA. O valor web/boot da linha serial vira encerrado_operador.
      enum: [automatica, encerrado_operador]
    MotivoRecusa:
      type: string
      enum: [tentativa_aberta, limite_3, execucao_cancelada]
    Rumo:
      type: string
      enum: ["N", "S", "L", "O"]
    EixoLongo:
      type: string
      enum: [x, y]

    NovaExecucao:
      type: object
      required: [labirinto]
      properties:
        labirinto:
          $ref: "#/components/schemas/Labirinto"
    RetornoNovaExecucao:
      type: object
      description: >
        Recibo ao abrir uma tentativa. Em POST /execucoes, attempt_index é 1.
        Em POST /execucoes/{id}/retomar, é 2 ou 3.
      required: [execucao_id, tentativa_id, attempt_index]
      properties:
        execucao_id:
          type: string
          format: uuid
        tentativa_id:
          type: string
          format: uuid
        attempt_index:
          type: integer
          minimum: 1
          maximum: 3
    EncerrarTentativa:
      type: object
      required: [motivo]
      properties:
        motivo:
          $ref: "#/components/schemas/MotivoEncerramento"
        observacao:
          type: string
          maxLength: 100
          nullable: true

    ItemHealthCheck:
      type: object
      required: [componente, aprovado]
      properties:
        componente:
          $ref: "#/components/schemas/Componente"
        aprovado:
          type: boolean
        valor_lido:
          type: number
          nullable: true
    Falha:
      type: object
      required: [motivo, origem, celula_x, celula_y, momento_falha]
      properties:
        motivo:
          $ref: "#/components/schemas/MotivoFalha"
        origem:
          $ref: "#/components/schemas/OrigemFalha"
        celula_x:
          type: integer
          minimum: 0
          maximum: 11
        celula_y:
          type: integer
          minimum: 0
          maximum: 11
        componente:
          allOf:
            - $ref: "#/components/schemas/Componente"
          nullable: true
        observacao:
          type: string
          maxLength: 100
          nullable: true
        momento_falha:
          type: string
          format: date-time
    Tentativa:
      type: object
      required: [tentativa_id, attempt_index, status, tipo_inicio, iniciada_em, health_check]
      properties:
        tentativa_id:
          type: string
          format: uuid
        attempt_index:
          type: integer
          minimum: 1
          maximum: 3
        status:
          $ref: "#/components/schemas/StatusTentativa"
        tipo_inicio:
          $ref: "#/components/schemas/TipoInicio"
        tipo_dip:
          allOf:
            - $ref: "#/components/schemas/TipoDip"
          nullable: true
        iniciada_em:
          type: string
          format: date-time
        encerrada_em:
          type: string
          format: date-time
          nullable: true
        tempo_s:
          type: number
          nullable: true
        velocidade_media:
          type: number
          nullable: true
          description: Metros por segundo. Distância em células vezes 180 mm, dividida pelo tempo.
        bateria_inicial:
          type: number
          nullable: true
          description: Tensão em volts no início da tentativa.
        bateria_final:
          type: number
          nullable: true
        consumo_bateria:
          type: number
          nullable: true
        health_check:
          type: array
          items:
            $ref: "#/components/schemas/ItemHealthCheck"
        falha:
          allOf:
            - $ref: "#/components/schemas/Falha"
          nullable: true

    PassoTrajeto:
      type: object
      required: [passo_id, seq, x, y, paredes_mask, retomada]
      properties:
        passo_id:
          type: integer
          description: Também é o id do evento SSE passo.
        seq:
          type: integer
          minimum: 1
        x:
          type: integer
          minimum: 0
          maximum: 11
        y:
          type: integer
          minimum: 0
          maximum: 11
        paredes_mask:
          type: integer
          minimum: 0
          maximum: 15
          description: "N = 1, S = 2, L = 4, O = 8."
        retomada:
          type: boolean
        entrou_em:
          type: string
          format: date-time
    LeituraTelemetria:
      type: object
      required: [ordem, x, y, bateria, enviado_em]
      properties:
        ordem:
          type: integer
          minimum: 1
        x:
          type: integer
          minimum: 0
          maximum: 11
        y:
          type: integer
          minimum: 0
          maximum: 11
        bateria:
          type: number
          description: Tensão em volts, convertida de bat_mv.
        velocidade:
          type: number
          nullable: true
          description: Metros por segundo, convertidos de vel_mm_s.
        rumo:
          allOf:
            - $ref: "#/components/schemas/Rumo"
          nullable: true
        enviado_em:
          type: string
          format: date-time

    ExecucaoDetalhe:
      type: object
      description: >
        Retrato usado por GET /execucoes/em-andamento e GET /execucoes/{id}.
        Trajeto, health-check e falha começam vazios e são preenchidos por
        linhas novas, não por este POST de criação.
      required:
        - execucao_id
        - labirinto
        - status
        - tentativas_usadas
        - iniciada_em
        - tentativas
        - trajeto
        - leituras
      properties:
        execucao_id:
          type: string
          format: uuid
        labirinto:
          $ref: "#/components/schemas/Labirinto"
        status:
          $ref: "#/components/schemas/StatusExecucao"
        tentativas_usadas:
          type: integer
          minimum: 0
          maximum: 3
        iniciada_em:
          type: string
          format: date-time
        encerrada_em:
          type: string
          format: date-time
          nullable: true
        tempo_total_s:
          type: number
          nullable: true
        variacao_melhor_tempo_pct:
          type: number
          nullable: true
          description: >
            Variação percentual contra o melhor tempo do mesmo labirinto (US16).
            Negativo quando esta execução foi mais rápida. Null se não houver marca anterior.
        eixo_longo:
          allOf:
            - $ref: "#/components/schemas/EixoLongo"
          nullable: true
          description: >
            Eixo em que o 8x4 ou o 12x4 se estende. Null no 4x4 e enquanto
            o robô não entrou numa célula além do canto 4x4.
        ultima_mensagem_em:
          type: string
          format: date-time
          nullable: true
          description: >
            Recebimento da última mensagem. A View usa este instante para a
            tela 06. Aos 10 s sem mensagem a execução passa a cancelada,
            com link_lost.
        tentativas:
          type: array
          items:
            $ref: "#/components/schemas/Tentativa"
        trajeto:
          type: array
          items:
            $ref: "#/components/schemas/PassoTrajeto"
        leituras:
          type: array
          description: Leituras da tentativa aberta, ou as últimas se já estiver encerrada.
          items:
            $ref: "#/components/schemas/LeituraTelemetria"

    ResumoExecucao:
      type: object
      required: [execucao_id, labirinto, status, tentativas_usadas, iniciada_em]
      properties:
        execucao_id:
          type: string
          format: uuid
        labirinto:
          $ref: "#/components/schemas/Labirinto"
        status:
          $ref: "#/components/schemas/StatusExecucao"
        tentativas_usadas:
          type: integer
          minimum: 0
          maximum: 3
        iniciada_em:
          type: string
          format: date-time
        encerrada_em:
          type: string
          format: date-time
          nullable: true
        tempo_total_s:
          type: number
          nullable: true
        velocidade_media:
          type: number
          nullable: true
          description: Velocidade média da última tentativa, em metros por segundo.
        consumo_bateria:
          type: number
          nullable: true
          description: Consumo da última tentativa, em volts.

    EventoTelemetria:
      type: object
      required: [tipo, ordem, x, y, bateria, enviado_em]
      properties:
        tipo:
          type: string
          enum: [telemetria]
        ordem:
          type: integer
        x:
          type: integer
        y:
          type: integer
        bateria:
          type: number
        velocidade:
          type: number
          nullable: true
        rumo:
          allOf:
            - $ref: "#/components/schemas/Rumo"
          nullable: true
        eixo_longo:
          allOf:
            - $ref: "#/components/schemas/EixoLongo"
          nullable: true
        enviado_em:
          type: string
          format: date-time
    EventoPasso:
      type: object
      required: [tipo, passo_id, seq, x, y, paredes_mask, retomada]
      properties:
        tipo:
          type: string
          enum: [passo]
        passo_id:
          type: integer
        seq:
          type: integer
        x:
          type: integer
        y:
          type: integer
        paredes_mask:
          type: integer
          minimum: 0
          maximum: 15
        retomada:
          type: boolean
        entrou_em:
          type: string
          format: date-time
    EventoStatus:
      type: object
      required: [tipo, tentativa_id, attempt_index, status_tentativa, status_execucao]
      properties:
        tipo:
          type: string
          enum: [status]
        tentativa_id:
          type: string
          format: uuid
        attempt_index:
          type: integer
          minimum: 1
          maximum: 3
        status_tentativa:
          $ref: "#/components/schemas/StatusTentativa"
        status_execucao:
          $ref: "#/components/schemas/StatusExecucao"
        tipo_dip:
          allOf:
            - $ref: "#/components/schemas/TipoDip"
          nullable: true
    EventoHealthCheck:
      type: object
      required: [tipo, tentativa_id, componente, aprovado]
      properties:
        tipo:
          type: string
          enum: [health_check]
        tentativa_id:
          type: string
          format: uuid
        componente:
          $ref: "#/components/schemas/Componente"
        aprovado:
          type: boolean
        valor_lido:
          type: number
          nullable: true
    EventoFalha:
      type: object
      required: [tipo, tentativa_id, motivo, origem, celula_x, celula_y, momento_falha, status_execucao]
      properties:
        tipo:
          type: string
          enum: [falha]
        tentativa_id:
          type: string
          format: uuid
        motivo:
          $ref: "#/components/schemas/MotivoFalha"
        origem:
          $ref: "#/components/schemas/OrigemFalha"
        celula_x:
          type: integer
        celula_y:
          type: integer
        componente:
          allOf:
            - $ref: "#/components/schemas/Componente"
          nullable: true
        observacao:
          type: string
          nullable: true
          maxLength: 100
        momento_falha:
          type: string
          format: date-time
        status_execucao:
          $ref: "#/components/schemas/StatusExecucao"
    EventoSucesso:
      type: object
      required: [tipo, tentativa_id, x, y, status_execucao]
      properties:
        tipo:
          type: string
          enum: [sucesso]
        tentativa_id:
          type: string
          format: uuid
        x:
          type: integer
        y:
          type: integer
        status_execucao:
          $ref: "#/components/schemas/StatusExecucao"

    LinhaTelemetria:
      type: object
      required: [linha, recebido_em]
      properties:
        linha:
          type: string
          description: Linha lida da serial, sem a quebra de linha e sem alteração.
        recebido_em:
          type: string
          format: date-time
          description: Instante em que a ponte leu a linha, com fuso.
    ComandoInterromper:
      type: object
      required: [v, cmd]
      properties:
        v:
          type: integer
          enum: [1]
        cmd:
          type: string
          enum: [interromper]
    RespostaTelemetria:
      type: object
      required: [comandos]
      properties:
        comandos:
          type: array
          items:
            $ref: "#/components/schemas/ComandoInterromper"

    Recusa:
      type: object
      required: [motivo, ocorrida_em]
      properties:
        motivo:
          $ref: "#/components/schemas/MotivoRecusa"
        ocorrida_em:
          type: string
          format: date-time
    ErroNaoEncontrado:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    ErroValidacao:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
              msg:
                type: string
              type:
                type: string
