        execucao_id: 123e4567-e89b-12d3-a456-426614174000
        labirinto: "4x4"
        status: em_andamento
        tentativas_usadas: 1
        iniciada_em: "2026-10-07T14:00:00-03:00"
        encerrada_em: null
        tempo_total_s: null
        variacao_melhor_tempo_pct: null
        eixo_longo: null
        ultima_mensagem_em: "2026-10-07T14:00:04-03:00"
        tentativas:
          - tentativa_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            attempt_index: 1
            status: health-check
            tipo_inicio: nova
            tipo_dip: null
            iniciada_em: "2026-10-07T14:00:00-03:00"
            encerrada_em: null
            tempo_s: null
            velocidade_media: null
            bateria_inicial: null
            bateria_final: null
            consumo_bateria: null
            health_check:
              - componente: bateria
                aprovado: true
                valor_lido: 7.84
              - componente: tof_frontal_esq
                aprovado: true
                valor_lido: 180
            falha: null
        trajeto: []
        leituras:
          - ordem: 1
            x: 0
            y: 0
            bateria: 7.84
            velocidade: 0
            rumo: "N"
            enviado_em: "2026-10-07T14:00:04-03:00"
    Tela03EmExecucao:
      summary: Tela 03, tentativa 1 em running
      value:
        execucao_id: 123e4567-e89b-12d3-a456-426614174000
        labirinto: "4x4"
        status: em_andamento
        tentativas_usadas: 1
        iniciada_em: "2026-10-07T14:00:00-03:00"
        encerrada_em: null
        tempo_total_s: null
