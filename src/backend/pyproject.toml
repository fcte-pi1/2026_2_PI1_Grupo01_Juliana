[project]
name = "micromouse-backend"
version = "0.1.0"
description = "API REST e SSE do Sistema de Telemetria Micromouse"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contrato"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "contrato", "tests", "ponte"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
