name: firmware

on:
  push:
    branches: [main, dev]
    paths:
      - "src/firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "src/firmware/**"
      - ".github/workflows/firmware.yml"

defaults:
  run:
    working-directory: src/firmware

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: platformio-${{ hashFiles('src/firmware/platformio.ini', 'src/firmware/requirements.txt') }}

      - run: pip install -r requirements.txt

      - name: navegacao/ sem Arduino, FreeRTOS ou HAL
        run: |
          if grep -rnE '#include *[<"](Arduino|freertos/|esp_|hal_)' lib/navegacao; then
            echo "navegacao/ precisa ser C puro" && exit 1
          fi

      - name: Contrato byte a byte (ARQ-01)
        run: make -C lib/contrato teste

      - name: Testes no PC (Unity)
        run: pio test -e native

      - name: Verificador da serial (tools)
        run: pip install pytest && pytest -q tools

      # Uma linha por labirinto no log e no resumo da execução. Falha se algum
      # labirinto for inválido ou não terminar em sucesso.
      - name: Simulador de navegação (FIRM-02)
        run: |
          set -o pipefail
          make -C simulador-navegacao build/simulador
          ./simulador-navegacao/build/simulador --exigir-sucesso --telemetria simulador-navegacao/build/telemetria simulador-navegacao/labirintos/*.txt | tee simulador-navegacao/build/relatorio.txt
          {
            echo '### Simulador de navegação'
            echo '```text'
            cat simulador-navegacao/build/relatorio.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Com 5% de leituras erradas a corrida pode falhar (sem_caminho ou
      # colisao), mas tem de terminar e nunca declarar sucesso fora do
      # objetivo. A taxa de sucesso vai para o resumo só como informação.
      - name: Simulador de navegação com ruído
        run: |
          sucessos=0
          total=0
          for semente in $(seq 1 20); do
            ./simulador-navegacao/build/simulador --ruido 5 --semente "$semente" --exigir-termino simulador-navegacao/labirintos/*.txt > simulador-navegacao/build/ruido.txt || { cat simulador-navegacao/build/ruido.txt; exit 1; }
            sucessos=$((sucessos + $(grep -c ' sucesso ' simulador-navegacao/build/ruido.txt || true)))
            total=$((total + $(ls simulador-navegacao/labirintos/*.txt | wc -l)))
          done
          echo "Com 5% de ruído, sementes 1 a 20: $sucessos de $total corridas em sucesso"
          {
            echo '### Simulador de navegação com 5% de ruído'
            echo "Sementes 1 a 20: $sucessos de $total corridas em sucesso, nenhuma em limite ou sucesso_falso."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar roteiros de telemetria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roteiros-telemetria
          path: src/firmware/simulador-navegacao/build/telemetria/
          if-no-files-found: ignore

      - name: Compilar para a ESP32
        run: pio run -e esp32_sim
