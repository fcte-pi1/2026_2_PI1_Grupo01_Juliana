name: frontend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - src/frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - src/frontend/**
      - .github/workflows/frontend.yml

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
