name: backend

on:
  push:
    branches: [main, dev]
    paths:
      - src/backend/**
      - src/contrato/**
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - src/backend/**
      - src/contrato/**
      - .github/workflows/backend.yml

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: micromouse
          POSTGRES_PASSWORD: micromouse
          POSTGRES_DB: micromouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U micromouse -d micromouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://micromouse:micromouse@localhost:5432/micromouse_test
        run: pytest -q
