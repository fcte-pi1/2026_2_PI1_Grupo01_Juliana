name: ci

on:
  push:
    branches: [main, dev]   
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: micromouse
          POSTGRES_PASSWORD: micromouse
          POSTGRES_DB: micromouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U micromouse -d micromouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://micromouse:micromouse@localhost:5432/micromouse_test
        run: pytest -q

  destino-do-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir origem e destino
        run: |
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          if [ "$base" = "dev" ]; then
            exit 0
          fi
          if [ "$base" = "main" ] && [ "$head" = "dev" ]; then
            exit 0
          fi
          echo "PR de '$head' para '$base' não segue o fluxo. Feature entra em dev; main só recebe dev."
          exit 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - run: pip install mkdocs-material

      - run: mkdocs gh-deploy --force
